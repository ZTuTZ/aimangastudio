name: CI

on:
  pull_request:
    paths: ["server/**", "frontend/**", ".github/workflows/ci.yml"]
  push:
    branches: [main]
    paths: ["server/**", "frontend/**", ".github/workflows/ci.yml"]

jobs:
  backend:
    name: backend-verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Maven verify
        working-directory: server
        run: mvn -B verify

  frontend:
    name: frontend-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Test
        working-directory: frontend
        run: npm test
      - name: Build
        working-directory: frontend
        run: npm run build
