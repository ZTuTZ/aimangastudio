server:
  port: 8090
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: aimanga-v2
  # 不使用 Shiro 注解鉴权(全部走过滤器),排除其自动配置:
  # 否则 DefaultAdvisorAutoProxyCreator 会把 ServiceImpl 代理成 JDK 接口代理,破坏具体类注入
  autoconfigure:
    exclude:
      - org.apache.shiro.spring.boot.autoconfigure.ShiroAnnotationProcessorAutoConfiguration
  # 开发默认 local(含本机 MySQL 密码的 application-local.yml,已 gitignore);
  # 生产部署必须显式设置 SPRING_PROFILES_ACTIVE=prod 且通过环境变量注入全部敏感配置
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:aimanga_v2}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 10000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Redis 有密码时用环境变量 SPRING_DATA_REDIS_PASSWORD 注入(留空则不发送 AUTH)
      database: ${REDIS_DATABASE:0}
      timeout: 5s
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: true
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 200MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto

aimanga:
  # T2.1 启用 JWT;生产环境必填,无默认值
  jwt-secret: ${JWT_SECRET:}
  jwt-access-ttl-minutes: 120
  jwt-refresh-ttl-days: 7

logging:
  level:
    com.aimanga.v2: info
